# Tests and full arc42 build in the Docker image, for every pull request (including the
# submodule updates from Dependabot) and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the Docker image
        run: make image

      - name: Test scripts
        run: make test

      - name: Full arc42 build (validation, all formats, ZIPs, output checks)
        run: make build

      # Builds are reproducible: the base commit, built with the same arc42-template commit, gives
      # byte-identical ZIPs unless the pull request changes them. The job summary lists the ZIPs that
      # differ, so that a change of the output is seen and intended. Never fails the job.
      - name: Compare the ZIPs with the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          base=${{ github.event.pull_request.base.sha }}
          template=$(git -C arc42-template rev-parse HEAD)
          git fetch -q --depth=1 origin "$base"
          git worktree add -q ../base "$base"
          git -C ../base submodule update -q --init --recursive
          git -C ../base/arc42-template fetch -q origin "$template"
          git -C ../base/arc42-template checkout -q "$template"
          make -C ../base generate > base-build.log 2>&1 || { tail -n 50 base-build.log; exit 1; }
          cp ../base/build/dist/manifest.json baseline-manifest.json
          {
            echo "## Distribution ZIPs compared with the base branch"
            echo '```'
            make manifest-diff 2>&1 | grep -v -e 'Container' -e '^docker compose' -e '^make' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
