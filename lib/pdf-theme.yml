# Theme of the PDF output (asciidoctor-pdf): the default theme, plus fallback fonts for the
# characters its Noto Serif subset does not contain: the full Noto Serif for Latin letters such as
# the Azerbaijani Ə, then Droid Sans Fallback for Chinese. The fonts are looked up in pdf-fontsdir,
# which the converter sets to the bundled fonts and the directories of the fallback fonts in the image.
# A fallback font is only used (and embedded) for characters the main font lacks.
extends: default
font:
  catalog:
    merge: true
    NotoSerifFull:
      normal: NotoSerif-Regular.ttf
      bold: NotoSerif-Bold.ttf
      italic: NotoSerif-Italic.ttf
      bold_italic: NotoSerif-BoldItalic.ttf
    DroidSansFallback:
      normal: DroidSansFallbackFull.ttf
      bold: DroidSansFallbackFull.ttf
      italic: DroidSansFallbackFull.ttf
      bold_italic: DroidSansFallbackFull.ttf
  fallbacks: [NotoSerifFull, DroidSansFallback]
