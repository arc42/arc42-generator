services:
  arc42-builder:
    build: .
    image: arc42-generator:9.1.0
    container_name: arc42-generator-build
    volumes:
      - .:/workspace
    working_dir: /workspace
    # passed through from the calling environment, see: make help
    environment:
      - UPDATE_TEMPLATE
      - SOURCE_DATE_EPOCH
    command: make build
